server:
  port: 8080

spring:
  application:
    name: saccos-loan-service

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/loan}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:admin}
    password: ${RABBITMQ_PASSWORD:password}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

# Fineract
fineract:
  base-url: ${FINERACT_BASE_URL:https://localhost:8443/fineract-provider/api/v1}
  username: ${FINERACT_USERNAME:mifos}
  password: ${FINERACT_PASSWORD:password}
  tenant-id: ${FINERACT_TENANT_ID:default}
  loan-product-id:
    emergency: ${FINERACT_PRODUCT_EMERGENCY:1}
    development: ${FINERACT_PRODUCT_DEVELOPMENT:2}
    education: ${FINERACT_PRODUCT_EDUCATION:3}
    business: ${FINERACT_PRODUCT_BUSINESS:4}
    housing: ${FINERACT_PRODUCT_HOUSING:5}

# Member service
services:
  member-service:
    base-url: ${MEMBER_SERVICE_URL:http://localhost:8081}

# SACCOS business rules
saccos:
  eligibility:
    min-membership-months: ${ELIGIBILITY_MIN_MONTHS:6}
    loan-to-shares-multiplier: ${ELIGIBILITY_SHARES_MULTIPLIER:3}
    min-loan-amount: ${ELIGIBILITY_MIN_LOAN:10000}
    max-loan-amount: ${ELIGIBILITY_MAX_LOAN:10000000}
    max-active-loans: ${ELIGIBILITY_MAX_ACTIVE_LOANS:1}
  guarantor:
    minimum-required: ${GUARANTOR_MIN_REQUIRED:2}
    max-active-guarantees: ${GUARANTOR_MAX_ACTIVE:3}
  committee:
    quorum-size: ${COMMITTEE_QUORUM:3}
    approval-threshold: ${COMMITTEE_THRESHOLD:0.5}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
